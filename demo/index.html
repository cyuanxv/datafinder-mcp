<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DataFinder MCP — Synthetic analytics demo</title><link rel="stylesheet" href="/style.css"></head><body>
<header><a href="/" class="brand"><span class="mark">D</span>DataFinder <b>MCP</b></a><nav><button id="zh">简体中文</button><button id="en">English</button></nav></header>
<main><div class="eyebrow" id="eyebrow"></div><h1 id="heading"></h1><p class="lead" id="lead"></p><div class="notice" id="notice"></div>
