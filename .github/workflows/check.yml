name: Query service checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit --incremental false
      - name: Build standalone package
        working-directory: .
        run: node standalone/build.mjs
      - name: Install standalone dependencies
        working-directory: standalone/package
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Accept all 52 tools
        working-directory: .
        run: node standalone/acceptance.mjs "$PWD/standalone/package/server.mjs" "$RUNNER_TEMP/datafinder-acceptance.json"
